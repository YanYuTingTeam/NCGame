game:
  world: "minigame_world"
  spawns:
    spawn1:
      x: 0.5
      y: 64.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    spawn2:
      x: 5.5
      y: 64.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
  sheep-region:
    pos1:
      x: 10.0
      y: 64.0
      z: 10.0
    pos2:
      x: 30.0
      y: 70.0
      z: 30.0
  max-sheep: 16
  spawn-interval: 40
  explode-chance: 0.3
  explode-damage: 4.0
  explosion-power: 2.0      # 爆炸威力，影响方块破坏范围
  death-y: 0.0              # 死亡高度
  prepare-time: 10
  game-time: 300
  countdown-sound: true
  spectator:
    spawn:
      world: "minigame_world"
      x: 100.0
      y: 70.0
      z: 100.0
      yaw: 0.0
      pitch: 0.0
    region:
      center:
        x: 100.0
        y: 70.0
        z: 100.0
      radius: 50
  scoreboard:
    title: "&6炸弹羊"
    lines:
      - "&f时间: &a{time_left}&f/&a{total_time}&f秒"
      - "&f积分: &a{score}"
      - "&f-------------"
      - "&f退出游戏: &a/hub"
      - ""
      - "&eyour minecraft server"