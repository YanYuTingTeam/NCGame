game:
  world: "minigame_world"
  spawns:
    spawn1:
      x: 0.5
      y: 64.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    spawn2:
      x: 2.5
      y: 64.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
  win-region:
    world: "minigame_world"
    pos1:
      x: 50.0
      y: 60.0
      z: 50.0
    pos2:
      x: 55.0
      y: 70.0
      z: 55.0
  trap:
    launch-power: 2.0
    teleport-back: true
    teleport-delay: 20
    # 新增起飞特效配置
    effect:
      enabled: true          # 是否启用特效
      particle: FLAME        # 粒子类型（可改为 LAVA, SMOKE 等）
      count: 30              # 粒子数量
  prepare-time: 10
  game-time: 300
  countdown-sound: true
  spectator:
    spawn:
      world: "minigame_world"
      x: 100.0
      y: 70.0
      z: 100.0
      yaw: 0.0
      pitch: 0.0
    region:
      center:
        x: 100.0
        y: 70.0
        z: 100.0
      radius: 50
  scoreboard:
    title: "&6极限雷区"
    lines:
      - "&f时间: &a{time_left}&f/&a{total_time}&f秒"
      - "&f积分: &a{score}"
      - "&f-------------"
      - "&f退出游戏: &a/hub"
      - ""
      - "&eyour minecraft server"