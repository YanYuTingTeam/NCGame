game:
  world: "minigame_world"
  spawn:
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  barrier:
    enabled: true          # 是否启用屏障
    y: 62                  # 屏障所在的 Y 坐标
    pos1:
      x: -10.0
      z: -10.0
    pos2:
      x: 10.0
      z: 10.0
  # 死亡高度
  death-y: 0.0
  timer: 2.0
  jump-power: 0.42
  # 方块消失设置
  vanish:
    interval: 10          # 每隔多少 tick 消除一次（20 tick = 1秒）
    blocks:               # 可被消除的方块列表
      - SANDSTONE
      - STONE
      - DIRT
  prepare-time: 10
  game-time: 300
  countdown-sound: true
  spectator:
    spawn:
      world: "minigame_world"
      x: 100.0
      y: 70.0
      z: 100.0
      yaw: 0.0
      pitch: 0.0
    region:
      center:
        x: 100.0
        y: 70.0
        z: 100.0
      radius: 50
  scoreboard:
    title: "&6贪吃蛇"
    lines:
      - "&f时间: &a{time_left}&f/&a{total_time}&f秒"
      - "&f积分: &a{score}"
      - "&f-------------"
      - "&f退出游戏: &a/hub"
      - ""
      - "&eyour minecraft server"